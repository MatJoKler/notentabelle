                    classDropdown += '<div style="padding: 8px 12px; background: #f5f5f5; font-weight: 600; font-size: 12px; color: #666; border-bottom: 1px solid #e0e0e0;">Klasse wechseln</div>';

                    Object.entries(data.classes).forEach(([classId, cls]) => {
                        if (classId !== student.classId) {
                            classDropdown += `<div onclick="changeStudentClass('${student.id}', '${student.classId}', '${classId}')"
                                                  style="padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0; transition: background 0.2s;"
                                                  onmouseover="this.style.background='#f5f5f5'"
                                                  onmouseout="this.style.background='white'">
                                                🪑 ${cls.name}
                                              </div>`;
                        }
                    });

                    classDropdown += '</div></div>';

                    html += `<tr class="student-row"
                                data-student-name="${student.name.toLowerCase()}"
                                data-student-id="${student.id}"
                                data-class-id="${student.classId}"
                                data-avg-grade="${avgGrade || ''}"
                                style="${rowStyle}${!shouldDisplay ? ' display: none;' : ''}">`;
                    html += `<td><input type="checkbox" class="student-checkbox" value="${student.id}" onchange="updateSelectedCount()" style="cursor: pointer;"></td>`;
                    html += `<td style="font-weight: 500;">👤 ${student.name}${isCritical ? ' 🔴' : isAtRisk ? ' ⚠️' : ''}</td>`;
                    html += `<td>${classDropdown}</td>`;
                    html += `<td style="font-weight: bold; color: ${isCritical ? '#c62828' : isAtRisk ? '#ff9800' : student.avgGrade ? '#2e7d32' : '#999'};">${student.avgGrade || '-'}</td>`;
                    html += `<td style="font-size: 12px;">${student.grades.length} ${student.grades.length === 1 ? 'Fach' : 'Fächer'}</td>`;
                    html += `<td><span style="background: #e8eaf6; color: #667eea; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600;">${student.noteCount}</span></td>`;
                    html += `<td style="display: flex; gap: 5px;">
                                <button onclick="openStudentDetails('${student.id}')" style="padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap;">
                                    Details
                                </button>
                                <button onclick="openStudentPrintView('${student.id}')" style="padding: 6px 12px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap;">
                                    🖨️ Druck
                                </button>
                            </td>`;
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
            }

            main.innerHTML = html;

            // Event-Listener für Dropdowns initialisieren
            setTimeout(() => initClassDropdowns(), 0);
        }

        function filterStudentRows(searchTerm) {
            const rows = document.querySelectorAll('.student-row');
            const term = searchTerm.toLowerCase();

            rows.forEach(row => {
                const studentName = row.dataset.studentName;
                if (studentName.includes(term)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function toggleAllStudents(checked) {
            document.querySelectorAll('.student-checkbox').forEach(cb => {
                if (cb.closest('tr').style.display !== 'none') {
                    cb.checked = checked;
                }
            });
            updateSelectedCount();
        }

        function selectAllStudents() {
            toggleAllStudents(true);
        }

        function deselectAllStudents() {
            toggleAllStudents(false);
        }

        function updateSelectedCount() {
            const count = document.querySelectorAll('.student-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = `${count} ausgewählt`;
        }

        // Filter für gefährdete Schüler setzen
        function setStudentFilter(mode) {
            studentFilterMode = mode;
            renderMain();
        }

        // ========================================
        // KLASSENWECHSEL PER DROPDOWN
        // ========================================

        // Hilfsfunktion: Schüler anhand ID finden
        function findStudentById(studentId) {
            for (const classId in data.classes) {
                const cls = data.classes[classId];
                const student = cls.students.find(s => s.id === studentId);
                if (student) return student;
            }
            return null;
        }

        // Klassenwechsel durchführen
        function changeStudentClass(studentId, fromClassId, toClassId) {
            const fromClass = data.classes[fromClassId];
            const toClass = data.classes[toClassId];
            const student = findStudentById(studentId);

            if (!student || !fromClass || !toClass) {
                alert('Fehler: Schüler oder Klasse nicht gefunden.');
                return;
            }

            // Bestätigungsdialog
            const confirmMsg = `Möchten Sie ${student.name} von Klasse ${fromClass.name} nach ${toClass.name} verschieben?\n\nAlle Noten und Notizen werden übertragen.`;
            if (!confirm(confirmMsg)) {
                return;
            }

            // Schüler aus alter Klasse entfernen
            const studentIndex = fromClass.students.findIndex(s => s.id === studentId);
            if (studentIndex === -1) {
                alert('Fehler: Schüler nicht gefunden.');
                return;
            }

            fromClass.students.splice(studentIndex, 1);

            // Schüler zur neuen Klasse hinzufügen
            toClass.students.push(student);

            // ALLE NOTEN übertragen
            Object.entries(data.grades).forEach(([subjectId, subjectGrades]) => {
                if (subjectGrades[fromClassId] && subjectGrades[fromClassId][studentId]) {
                    const studentGrades = subjectGrades[fromClassId][studentId];

                    if (!subjectGrades[toClassId]) {
                        subjectGrades[toClassId] = {};
                    }
                    subjectGrades[toClassId][studentId] = studentGrades;

                    delete subjectGrades[fromClassId][studentId];
                }
            });

            // AUTOMATISCHEN NOTIZ-EINTRAG erstellen
            const today = new Date();
            const dateStr = today.toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            const moveNote = {
                id: Date.now().toString(),
                type: 'general',
                text: `Klassenwechsel: Von ${fromClass.name} nach ${toClass.name} am ${dateStr}`,
                timestamp: today.getTime()
            };

            if (!data.studentNotes[studentId]) {
                data.studentNotes[studentId] = [];
            }
            data.studentNotes[studentId].unshift(moveNote);

            // Daten speichern und Ansicht aktualisieren
            saveData();
            renderMain();

            alert(`✅ ${student.name} wurde erfolgreich von ${fromClass.name} nach ${toClass.name} verschoben.`);
        }

        // Event-Listener für Dropdown-Click hinzufügen
        function initClassDropdowns() {
            // Alle offenen Dropdowns schließen
            function closeAllDropdowns() {
                document.querySelectorAll('.class-dropdown').forEach(dd => {
                    dd.style.display = 'none';
                });
            }

            // Click auf Klassennamen öffnet/schließt Dropdown
            const classNames = document.querySelectorAll('.class-name');
            classNames.forEach(className => {
                className.addEventListener('click', (e) => {
                    e.stopPropagation(); // Verhindert dass globaler Click-Handler triggert

                    const container = className.closest('.class-change-container');
                    const dropdown = container.querySelector('.class-dropdown');
                    const isVisible = dropdown.style.display === 'block';

                    // Alle anderen Dropdowns schließen
                    closeAllDropdowns();

                    // Aktuelles Dropdown öffnen/schließen
                    dropdown.style.display = isVisible ? 'none' : 'block';
                });
            });

            // Clicks innerhalb des Dropdowns sollen es nicht schließen
            const dropdowns = document.querySelectorAll('.class-dropdown');
            dropdowns.forEach(dropdown => {
                dropdown.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Nach Klassenwechsel wird Dropdown durch renderMain() automatisch geschlossen
                });
            });

            // Click außerhalb schließt alle Dropdowns
            document.addEventListener('click', closeAllDropdowns);
        }

        function openStudentDetails(studentId) {
            // Schülerdaten finden
            let studentData = null;
            let classData = null;
            Object.entries(data.classes).forEach(([classId, cls]) => {
                const student = cls.students.find(s => s.id === studentId);
                if (student) {
                    studentData = student;
                    classData = cls;
                }
            });

            if (!studentData) return;

            // Noten sammeln
            const grades = [];
            Object.entries(data.subjects).forEach(([subjectId, subject]) => {
                const classId = Object.keys(data.classes).find(cId =>
                    data.classes[cId].students.some(s => s.id === studentId)
                );

                if (subject.assignedClasses.includes(classId) &&
                    data.grades[subjectId] &&
                    data.grades[subjectId][classId] &&
                    data.grades[subjectId][classId][studentId]) {

                    const studentGrades = data.grades[subjectId][classId][studentId];
                    const ka1 = avg(studentGrades.ka1);
                    const ka2 = avg(studentGrades.ka2);
                    const t1 = avg(studentGrades.test1);
                    const t2 = avg(studentGrades.test2);
                    const m1 = avg(studentGrades.m1);
                    const m2 = avg(studentGrades.m2);
                    const h1 = weighted(ka1, t1, m1, subjectId);
                    const h2 = weighted(ka2, t2, m2, subjectId);
                    const year = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);

                    grades.push({
                        subject: subject.name,
                        year: year,
                        h1: h1,
                        h2: h2,
                        ka1: ka1,
                        t1: t1,
                        m1: m1,
                        ka2: ka2,
                        t2: t2,
                        m2: m2
                    });
                }
            });

            // Vorjahresdaten hinzufügen
            const hasArchives = Object.keys(data.archives).length > 0;
            grades.forEach(grade => {
                if (hasArchives) {
                    const prevData = getPreviousYearData(studentData.name, grade.subject);
                    grade.prevYear = prevData ? prevData.yearGrade : null;
                    grade.prevYearInfo = prevData ? prevData.year : null;
                }
            });

            grades.sort((a, b) => a.subject.localeCompare(b.subject));

            const avgGrade = grades.filter(g => g.year).length > 0 ?
                (grades.filter(g => g.year).reduce((a, b) => a + parseFloat(b.year), 0) / grades.filter(g => g.year).length).toFixed(2) : null;

            const validGrades = grades.filter(g => g.year).map(g => parseFloat(g.year));
            const bestGrade = validGrades.length > 0 ? Math.min(...validGrades).toFixed(2) : null;
            const worstGrade = validGrades.length > 0 ? Math.max(...validGrades).toFixed(2) : null;

            // Notizen nach Typ filtern
            const notes = data.studentNotes[studentId] || [];
            notes.sort((a, b) => b.timestamp - a.timestamp);

            const parentNotes = notes.filter(n => n.type === 'parent');
            const punishmentNotes = notes.filter(n => n.type === 'punishment');

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box" style="max-width: 95%; width: 1400px; max-height: 95vh; display: flex; flex-direction: column;">
                    <!-- ✅ HEADER mit PDF-Export oben rechts -->
                    <div style="padding: 30px 30px 20px 30px; border-bottom: 2px solid #f0f0f0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h2 style="font-size: 28px; margin: 0;">👤 ${studentData.name}</h2>
                            <div style="display: flex; gap: 10px;">
                                <button onclick="exportSingleStudentPDF('${studentId}')"
                                        style="padding: 10px 16px; background: #c62828; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;">
                                    📄 PDF Export
                                </button>
                                <button onclick='this.closest(".modal-overlay").remove()'
                                        style="padding: 8px 16px; background: #f0f0f0; color: #666; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 20px;">
                                    ✕
                                </button>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div style="background: #e8eaf6; padding: 12px 20px; border-radius: 12px;">
                                <div style="font-size: 11px; color: #667eea; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Klasse</div>
                                <div style="font-size: 18px; font-weight: bold; color: #333;">🪑 ${classData.name}</div>
                            </div>
                            <div style="background: #e8f5e9; padding: 12px 20px; border-radius: 12px;">
                                <div style="font-size: 11px; color: #2e7d32; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Notendurchschnitt</div>
                                <div style="font-size: 24px; font-weight: bold; color: #2e7d32;">${avgGrade || '-'}</div>
                            </div>
                            <div style="background: #c8e6c9; padding: 12px 20px; border-radius: 12px;">
                                <div style="font-size: 11px; color: #1b5e20; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Beste Note</div>
                                <div style="font-size: 20px; font-weight: bold; color: #1b5e20;">🏆 ${bestGrade || '-'}</div>
                            </div>
                            <div style="background: #ffcdd2; padding: 12px 20px; border-radius: 12px;">
                                <div style="font-size: 11px; color: #b71c1c; font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">Schlechteste Note</div>
                                <div style="font-size: 20px; font-weight: bold; color: #b71c1c;">📉 ${worstGrade || '-'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- ✅ HAUPT-TABS: Noten / Notizen -->
                    <div style="display: flex; gap: 5px; padding: 0 30px; background: #fafafa; border-bottom: 2px solid #e0e0e0;">
                        <button class="student-main-tab active" onclick="switchStudentMainTab(event, 'grades')"
                                style="padding: 16px 28px; background: white; border: none; border-bottom: 4px solid #667eea; cursor: pointer; font-weight: 700; color: #667eea; font-size: 15px;">
                            📊 Noten

                        <button class="student-main-tab" onclick="switchStudentMainTab(event, 'notes')"
                                style="padding: 16px 28px; background: none; border: none; border-bottom: 4px solid transparent; cursor: pointer; font-weight: 700; color: #999; font-size: 15px;">
                            📝 Notizen (${notes.length})

                    </div>

                    <!-- ✅ SUB-NAVIGATION: Kategorien (nur sichtbar bei Notizen-Tab) -->
                    <div id="notes-subnav" style="display: none; gap: 5px; padding: 15px 30px; background: #f5f5f5; border-bottom: 2px solid #e0e0e0;">
                        <button class="note-category-tab active" data-category="all" onclick="switchNoteCategory('${studentId}', 'all', this)"
                                style="padding: 10px 20px; background: white; border: none; border-bottom: 3px solid #667eea; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; color: #667eea; font-size: 13px;">

                        <button class="note-category-tab" data-category="punishment" onclick="switchNoteCategory('${studentId}', 'punishment', this)"

                    <!-- ✅ TAB-INHALT: NOTEN -->
                    <div id="tab-grades" class="student-tab-content" style="flex: 1; overflow-y: auto; padding: 30px;">
                        <h3 style="margin-bottom: 20px; font-size: 20px; color: #333;">Notenübersicht</h3>
                        ${grades.length === 0 ? '<p style="color: #999; text-align: center; padding: 40px;">Noch keine Noten vorhanden</p>' : ''}
                        ${grades.length > 0 ? `
                            ${hasArchives ? `<div style="margin-bottom: 10px; padding: 10px; background: #f3e5f5; border-left: 4px solid #9c27b0; border-radius: 4px; font-size: 12px; color: #6a1b9a;">
                                📊 <strong>Vorjahresvergleich aktiviert:</strong> Die Spalte "Vorjahr" zeigt die Jahresnote aus dem letzten archivierten Schuljahr für dieses Fach (falls vorhanden).
                            </div>` : ''}
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f8f8f8;">
                                        <th style="padding: 10px; text-align: left; border-bottom: 2px solid #e0e0e0;">Fach</th>

                                        <th style="padding: 10px; text-align: center; border-bottom: 2px solid #e0e0e0;">1. HJ</th>

                                        // Vorjahresnote hinzufügen wenn Archive vorhanden

                                            if (g.prevYear) {

                                                let diffSymbol = '';
                                                let diffColor = '#999';

        // ✅ HELPER: Notiz-Card erstellen
        function createNoteCard(note, studentId, originalIndex) {
            const typeIcons = { general: '📌', parent: '👨‍👩‍👧', punishment: '⚠️' };
            const typeNames = { general: 'Allgemeine Notiz', parent: 'Elterngespräch', punishment: 'Strafarbeit' };
            const typeColors = { general: '#e3f2fd', parent: '#f3e5f5', punishment: '#fff3e0' };
            const typeBorders = { general: '#2196f3', parent: '#9c27b0', punishment: '#ff9800' };

            return `
                <div style="background: ${typeColors[note.type]}; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid ${typeBorders[note.type]}; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 20px;">${typeIcons[note.type]}</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 700; color: ${typeBorders[note.type]};">
                                    ${typeNames[note.type]}
                                </div>
                                <div style="font-size: 11px; color: #666; margin-top: 2px;">
                                    ${new Date(note.timestamp).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })}
                                    um ${new Date(note.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteStudentNote('${studentId}', ${originalIndex})"
                                style="background: #ffebee; color: #c62828; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">
                            🗑️ Löschen
                        </button>
                    </div>
                    <div style="font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap; padding: 12px; background: white; border-radius: 8px;">${note.text}</div>
                </div>
            `;
        }

        // ✅ HAUPT-TAB wechseln (Noten <-> Notizen)
        function switchStudentMainTab(event, tabName) {
            // Alle Haupt-Tabs deaktivieren
            document.querySelectorAll('.student-main-tab').forEach(tab => {
                tab.style.borderBottom = '4px solid transparent';
                tab.style.color = '#999';
                tab.style.background = 'none';
            });

            // Alle Tab-Inhalte ausblenden
            document.querySelectorAll('.student-tab-content').forEach(content => {
                content.style.display = 'none';
            });

            // Geklickten Tab aktivieren
            if (event) {
                event.target.style.borderBottom = '4px solid #667eea';
                event.target.style.color = '#667eea';
                event.target.style.background = 'white';
            }

            // Entsprechenden Inhalt einblenden
            document.getElementById('tab-' + tabName).style.display = tabName === 'notes' ? 'block' : 'flex';
            
            // ✅ Sub-Navigation nur bei Notizen anzeigen
            const subnav = document.getElementById('notes-subnav');
            if (tabName === 'notes') {
                subnav.style.display = 'flex';
            } else {
                subnav.style.display = 'none';
            }
        }

        // ✅ Kategorie wechseln (Sub-Tabs)
        function switchNoteCategory(studentId, category, clickedButton) {
            // Update alle Kategorie-Buttons
            document.querySelectorAll('.note-category-tab').forEach(tab => {
                tab.style.background = '#fafafa';
                tab.style.borderBottom = '3px solid transparent';
                tab.style.color = '#666';
            });
            
            // Aktiviere geklickten Tab
            clickedButton.style.background = 'white';
            clickedButton.style.borderBottom = '3px solid #667eea';
            clickedButton.style.color = '#667eea';
            
            // Update Listen-Anzeige
            document.querySelectorAll('.notes-list').forEach(list => {
                list.style.display = 'none';
            });
            
            if (category === 'all') {
                document.getElementById('notes-list-all').style.display = 'block';
            } else {
                document.getElementById('notes-list-' + category).style.display = 'block';
            }
        }

        // ✅ Druckansicht öffnen
        function openStudentPrintView(studentId) {
            // Schülerdaten finden
            let studentData = null;
            let classData = null;
            Object.entries(data.classes).forEach(([classId, cls]) => {
                const student = cls.students.find(s => s.id === studentId);
                if (student) {
                    studentData = student;
                    classData = cls;
                }
            });

            if (!studentData) return;

            // Noten sammeln
            const grades = [];
            Object.entries(data.subjects).forEach(([subjectId, subject]) => {
                const classId = Object.keys(data.classes).find(cId =>
                    data.classes[cId].students.some(s => s.id === studentId)
                );

                if (subject.assignedClasses.includes(classId) &&
                    data.grades[subjectId] &&
                    data.grades[subjectId][classId] &&
                    data.grades[subjectId][classId][studentId]) {

                    const studentGrades = data.grades[subjectId][classId][studentId];
                    const ka1 = avg(studentGrades.ka1);
                    const ka2 = avg(studentGrades.ka2);
                    const t1 = avg(studentGrades.test1);
                    const t2 = avg(studentGrades.test2);
                    const m1 = avg(studentGrades.m1);
                    const m2 = avg(studentGrades.m2);
                    const h1 = weighted(ka1, t1, m1, subjectId);
                    const h2 = weighted(ka2, t2, m2, subjectId);
                    const year = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);

                    grades.push({
                        subject: subject.name,
                        year: year,
                        h1: h1,
                        h2: h2,
                        ka1: ka1,
                        t1: t1,
                        m1: m1,
                        ka2: ka2,
                        t2: t2,
                        m2: m2
                    });
                }
            });

            // Vorjahresdaten hinzufügen
            const hasArchives = Object.keys(data.archives).length > 0;
            grades.forEach(grade => {
                if (hasArchives) {
                    const prevData = getPreviousYearData(studentData.name, grade.subject);
                    grade.prevYear = prevData ? prevData.yearGrade : null;
                    grade.prevYearInfo = prevData ? prevData.year : null;
                }
            });

            grades.sort((a, b) => a.subject.localeCompare(b.subject));

            const avgGrade = grades.filter(g => g.year).length > 0 ?
                (grades.filter(g => g.year).reduce((a, b) => a + parseFloat(b.year), 0) / grades.filter(g => g.year).length).toFixed(2) : null;

            const validGrades = grades.filter(g => g.year).map(g => parseFloat(g.year));
            const bestGrade = validGrades.length > 0 ? Math.min(...validGrades).toFixed(2) : null;
            const worstGrade = validGrades.length > 0 ? Math.max(...validGrades).toFixed(2) : null;

            // Notizen nach Typ gruppieren
            const notes = data.studentNotes[studentId] || [];
            notes.sort((a, b) => b.timestamp - a.timestamp);
            const generalNotes = notes.filter(n => n.type === 'general');
            const parentNotes = notes.filter(n => n.type === 'parent');
            const punishmentNotes = notes.filter(n => n.type === 'punishment');

            // Neues Fenster für Druckansicht
            const printWindow = window.open('', '_blank', 'width=1200,height=800');
            
            // HTML als String zusammenbauen
            let htmlContent = '<!DOCTYPE html>';
            htmlContent += '<html lang="de"><head>';
            htmlContent += '<meta charset="UTF-8">';
            htmlContent += '<title>Schülerakte - ' + studentData.name + '</title>';
            htmlContent += '<style>';
            htmlContent += '* { margin: 0; padding: 0; box-sizing: border-box; }';
            htmlContent += 'body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: white; color: #333; }';
            htmlContent += '.header { border-bottom: 4px solid #667eea; padding-bottom: 20px; margin-bottom: 30px; }';
            htmlContent += '.header h1 { font-size: 32px; color: #667eea; margin-bottom: 10px; }';
            htmlContent += '.header .info { font-size: 14px; color: #666; }';
            htmlContent += '.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }';
            htmlContent += '.stat-box { border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; text-align: center; }';
            htmlContent += '.stat-box .label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }';
            htmlContent += '.stat-box .value { font-size: 24px; font-weight: bold; color: #333; }';
            htmlContent += '.stat-box.primary { border-color: #667eea; background: #f0f2ff; }';
            htmlContent += '.stat-box.success { border-color: #2e7d32; background: #e8f5e9; }';
            htmlContent += '.stat-box.warning { border-color: #c62828; background: #ffebee; }';
            htmlContent += '.section { margin-bottom: 40px; page-break-inside: avoid; }';
            htmlContent += '.section-title { font-size: 20px; font-weight: bold; color: #667eea; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }';
            htmlContent += 'table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }';
            htmlContent += 'th { background: #f8f8f8; padding: 12px; text-align: left; font-weight: 600; font-size: 12px; border-bottom: 2px solid #e0e0e0; }';
            htmlContent += 'th.prevyear { background: #f3e5f5; color: #6a1b9a; }';
            htmlContent += 'td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }';
            htmlContent += 'td.center { text-align: center; }';
            htmlContent += 'td.bold { font-weight: bold; }';
            htmlContent += 'td.prevyear { background: #f3e5f5; font-size: 11px; }';
            htmlContent += 'td.prevyear .diff { font-size: 9px; margin-top: 2px; }';
            htmlContent += '.note-card { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0; page-break-inside: avoid; }';
            htmlContent += '.note-card:last-child { border-bottom: none; }';
            htmlContent += '.note-card .note-date { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 500; }';
            htmlContent += '.note-card .note-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: #333; }';
            htmlContent += '.empty-state { text-align: center; padding: 40px; color: #999; font-style: italic; }';
            htmlContent += '.actions { margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0; text-align: center; }';
            htmlContent += '.btn { padding: 12px 24px; margin: 0 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }';
            htmlContent += '.btn-print { background: #667eea; color: white; }';
            htmlContent += '.btn-close { background: #f0f0f0; color: #666; }';
            htmlContent += '@media print { body { padding: 20px; } .actions { display: none; } .section { page-break-inside: avoid; } }';
            htmlContent += '</style></head><body>';
            
            // Header
            htmlContent += '<div class="header">';
            htmlContent += '<h1>👤 ' + studentData.name + '</h1>';
            htmlContent += '<div class="info">Klasse: ' + classData.name + ' | Schuljahr: ' + (data.schoolYear || '2024/25') + ' | ';
            htmlContent += 'Erstellt: ' + new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) + '</div>';
            htmlContent += '</div>';
            
            // Statistiken
            htmlContent += '<div class="stats-grid">';
            htmlContent += '<div class="stat-box primary"><div class="label">Klasse</div><div class="value">🪑 ' + classData.name + '</div></div>';
            htmlContent += '<div class="stat-box success"><div class="label">Notendurchschnitt</div><div class="value">' + (avgGrade || '-') + '</div></div>';
            htmlContent += '<div class="stat-box success"><div class="label">Beste Note</div><div class="value">🏆 ' + (bestGrade || '-') + '</div></div>';
            htmlContent += '<div class="stat-box warning"><div class="label">Schlechteste Note</div><div class="value">📉 ' + (worstGrade || '-') + '</div></div>';
            htmlContent += '</div>';
            
            // Notenübersicht
            htmlContent += '<div class="section">';
            htmlContent += '<div class="section-title">📊 Notenübersicht</div>';
            if (hasArchives) {
                htmlContent += '<div style="margin-bottom: 10px; padding: 10px; background: #f3e5f5; border-left: 4px solid #9c27b0; border-radius: 4px; font-size: 12px; color: #6a1b9a;">';
                htmlContent += '📊 <strong>Vorjahresvergleich aktiviert:</strong> Die Spalte "Vorjahr" zeigt die Jahresnote aus dem letzten archivierten Schuljahr für dieses Fach (falls vorhanden).';
                htmlContent += '</div>';
            }
            if (grades.length === 0) {
                htmlContent += '<div class="empty-state">Noch keine Noten vorhanden</div>';
            } else {
                htmlContent += '<table><thead><tr>';
                htmlContent += '<th>Fach</th><th class="center">Jahr</th>';
                if (hasArchives) htmlContent += '<th class="center prevyear">Vorjahr</th>';
                htmlContent += '<th class="center">1. HJ</th>';
                htmlContent += '<th class="center">KA</th><th class="center">Test</th><th class="center">Mdl</th>';
                htmlContent += '<th class="center">2. HJ</th><th class="center">KA</th><th class="center">Test</th><th class="center">Mdl</th>';
                htmlContent += '</tr></thead><tbody>';

                grades.forEach(g => {
                    htmlContent += '<tr>';
                    htmlContent += '<td class="bold">' + g.subject + '</td>';
                    htmlContent += '<td class="center bold" style="color: #2e7d32;">' + (g.year || '-') + '</td>';

                    // Vorjahresnote hinzufügen wenn Archive vorhanden
                    if (hasArchives) {
                        if (g.prevYear) {
                            const diff = g.year && g.prevYear ? (parseFloat(g.year) - parseFloat(g.prevYear)).toFixed(2) : null;
                            let diffSymbol = '';
                            let diffColor = '#999';
                            if (diff !== null) {
                                if (diff < 0) {
                                    diffSymbol = ' ↗ ' + Math.abs(diff);
                                    diffColor = '#2e7d32';
                                } else if (diff > 0) {
                                    diffSymbol = ' ↘ ' + diff;
                                    diffColor = '#c62828';
                                } else {
                                    diffSymbol = ' →';
                                }
                            }
                            htmlContent += '<td class="center prevyear" title="Schuljahr ' + g.prevYearInfo + '">';
                            htmlContent += '<div style="font-weight: bold;">' + g.prevYear + '</div>';
                            if (diffSymbol) {
                                htmlContent += '<div class="diff" style="color: ' + diffColor + ';">' + diffSymbol + '</div>';
                            }
                            htmlContent += '</td>';
                        } else {
                            htmlContent += '<td class="center prevyear" style="color: #999;">-</td>';
                        }
                    }

                    htmlContent += '<td class="center" style="color: #667eea;">' + (g.h1 || '-') + '</td>';
                    htmlContent += '<td class="center">' + (g.ka1 || '-') + '</td>';
                    htmlContent += '<td class="center">' + (g.t1 || '-') + '</td>';
                    htmlContent += '<td class="center">' + (g.m1 || '-') + '</td>';

                    htmlContent += '<td class="center">' + (g.ka2 || '-') + '</td>';
                    htmlContent += '<td class="center">' + (g.t2 || '-') + '</td>';
                    htmlContent += '<td class="center">' + (g.m2 || '-') + '</td>';
                    htmlContent += '</tr>';
                });
                
                htmlContent += '</tbody></table>';
            }
            htmlContent += '</div>';
            
            // Allgemeine Notizen
            if (generalNotes.length > 0) {
                htmlContent += '<div class="section">';

                    htmlContent += '<div class="note-date">' + noteDate.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });

                    htmlContent += '<div class="note-text">' + note.text + '</div>';
                    htmlContent += '</div>';
                });
                htmlContent += '</div>';
            }
            
            // Elterngespräche
            if (parentNotes.length > 0) {
                htmlContent += '<div class="section">';
                htmlContent += '<div class="section-title">👨‍👩‍👧 Elterngespräche (' + parentNotes.length + ')</div>';
                parentNotes.forEach(note => {
                    const noteDate = new Date(note.timestamp);
                    htmlContent += '<div class="note-card">';
                    htmlContent += '<div class="note-date">' + noteDate.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
                    htmlContent += ' um ' + noteDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr</div>';
                    htmlContent += '<div class="note-text">' + note.text + '</div>';
                    htmlContent += '</div>';
                });
                htmlContent += '</div>';
            }
            
            // Strafarbeiten
            if (punishmentNotes.length > 0) {
                htmlContent += '<div class="section">';
                htmlContent += '<div class="section-title">⚠️ Strafarbeiten (' + punishmentNotes.length + ')</div>';
                punishmentNotes.forEach(note => {
                    const noteDate = new Date(note.timestamp);
                    htmlContent += '<div class="note-card">';
                        htmlContent += '<div class="note-date">' + noteDate.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
                        htmlContent += ' um ' + noteDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr</div>';
                        htmlContent += '<div class="note-text">' + note.text + '</div>';
                        htmlContent += '</div>';
                    });
                htmlContent += '</div>';
            }
            
            // Action Buttons
            htmlContent += '<div class="actions">';
            htmlContent += '<button class="btn btn-print" onclick="window.print()">🖨️ Drucken</button>';
            htmlContent += '<button class="btn btn-close" onclick="window.close()">Schließen</button>';
            htmlContent += '</div>';
            
            htmlContent += '</body></html>';
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

                        </button>
                    </div>
                    <div style="font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap; padding: 12px; background: white; border-radius: 8px;">${note.text}</div>
                </div>
            `;
        }

        // ✅ NEUE FUNKTION: Notiz in aktueller Kategorie hinzufügen
        function addStudentNoteInCategory(studentId) {
            const text = document.getElementById('noteText').value.trim();
            const category = document.getElementById('current-note-category').value;
            
            if (!text) {
                alert('Bitte geben Sie einen Text ein');
                return;
            }

            if (!data.studentNotes) data.studentNotes = {};
            if (!data.studentNotes[studentId]) data.studentNotes[studentId] = [];

            data.studentNotes[studentId].unshift({
                text: text,
                timestamp: Date.now(),
                type: category
            });

            saveData();
            
            // Modal schließen und neu öffnen
            document.querySelector('.modal-overlay').remove();
            openStudentDetails(studentId);
            
            // Nach Neuöffnung: Zur richtigen Kategorie wechseln
            setTimeout(() => {
                switchStudentTab(null, 'notes');
                const button = document.querySelector(`.note-category-tab[data-category="${category}"]`);
                if (button) switchNoteCategory(studentId, category, button);
            }, 100);
        }

        // ✅ Funktion zum Wechseln zwischen Notizen-Tabs
        function switchNotesTab(event, noteType, studentId) {
            // Alle Tabs deaktivieren
            event.target.parentElement.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Aktiven Tab aktivieren
            event.target.classList.add('active');

            // Alle Notizen-Inhalte ausblenden
            document.querySelectorAll('.notes-type-content').forEach(content => {
                content.style.display = 'none';
            });

            // Entsprechenden Content anzeigen
            const contentElement = document.getElementById(`notes-${noteType}`);
            if (contentElement) {
                contentElement.style.display = 'block';
                contentElement.style.flex = '1';
                contentElement.style.overflowY = 'auto';
            }
        }

        function addStudentNote(studentId) {
            const type = document.getElementById('noteType').value;
            const text = document.getElementById('noteText').value.trim();

            if (!text) {
                alert('Bitte geben Sie eine Notiz ein.');
                return;
            }

            if (!data.studentNotes[studentId]) {
                data.studentNotes[studentId] = [];
            }

            data.studentNotes[studentId].push({
                type: type,
                text: text,
                timestamp: Date.now()
            });

            saveData();

            // Modal schließen und neu öffnen um aktualisierte Liste zu zeigen
            document.querySelector('.modal-overlay').remove();
            openStudentNotes(studentId);
        }

        function deleteStudentNote(studentId, noteIndex) {
            if (!confirm('Diesen Eintrag wirklich löschen?')) return;

            data.studentNotes[studentId].splice(noteIndex, 1);
            saveData();

            // Modal schließen und neu öffnen
            document.querySelector('.modal-overlay').remove();
            openStudentDetails(studentId);
        }

        // PDF EXPORT FUNKTIONEN
        function exportSingleStudentPDF(studentId) {
            const students = [studentId];
            generateStudentsPDF(students);
        }

        function exportSelectedStudentsPDF() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('Bitte wählen Sie mindestens einen Schüler aus.');
                return;
            }

            const studentIds = Array.from(checkboxes).map(cb => cb.value);
            generateStudentsPDF(studentIds);
        }

        function generateStudentsPDF(studentIds) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let firstPage = true;

            studentIds.forEach((studentId, studentIndex) => {
                // Schülerdaten sammeln
                let studentData = null;
                let classData = null;
                Object.entries(data.classes).forEach(([classId, cls]) => {
                    const student = cls.students.find(s => s.id === studentId);
                    if (student) {
                        studentData = student;
                        classData = cls;
                    }
                });

                if (!studentData) return;

                // Noten sammeln
                const grades = [];
                Object.entries(data.subjects).forEach(([subjectId, subject]) => {
                    const classId = Object.keys(data.classes).find(cId =>
                        data.classes[cId].students.some(s => s.id === studentId)
                    );

                    if (subject.assignedClasses.includes(classId) &&
                        data.grades[subjectId] &&
                        data.grades[subjectId][classId] &&
                        data.grades[subjectId][classId][studentId]) {

                        const studentGrades = data.grades[subjectId][classId][studentId];
                        const ka1 = avg(studentGrades.ka1);
                        const ka2 = avg(studentGrades.ka2);
                        const t1 = avg(studentGrades.test1);
                        const t2 = avg(studentGrades.test2);
                        const m1 = avg(studentGrades.m1);
                        const m2 = avg(studentGrades.m2);
                        const h1 = weighted(ka1, t1, m1, subjectId);
                        const h2 = weighted(ka2, t2, m2, subjectId);
                        const year = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);

                        grades.push({
                            subject: subject.name,
                            year: year || '-',
                            h1: h1 || '-',
                            h2: h2 || '-',
                            ka1: ka1 || '-',
                            t1: t1 || '-',
                            m1: m1 || '-',
                            ka2: ka2 || '-',
                            t2: t2 || '-',
                            m2: m2 || '-'
                        });
                    }
                });

                grades.sort((a, b) => a.subject.localeCompare(b.subject));

                const avgGrade = grades.filter(g => g.year !== '-').length > 0 ?
                    (grades.filter(g => g.year !== '-').reduce((a, b) => a + parseFloat(b.year), 0) / grades.filter(g => g.year !== '-').length).toFixed(2) : '-';

                // Notizen
                const notes = data.studentNotes[studentId] || [];
                notes.sort((a, b) => b.timestamp - a.timestamp);

                // Neue Seite für jeden Schüler (außer beim ersten)
                if (!firstPage) {
                    doc.addPage();
                } else {
                    firstPage = false;
                }

                // === SEITE 1: NOTEN & NOTIZEN ===
                let yPos = 20;

                // Header
                doc.setFontSize(20);
                doc.setFont(undefined, 'bold');
                doc.text(`Schülerbericht: ${studentData.name}`, 105, yPos, { align: 'center' });
                yPos += 10;

                doc.setFontSize(12);
                doc.setFont(undefined, 'normal');
                doc.text(`Klasse: ${classData.name} | Schuljahr: ${data.schoolYear}`, 105, yPos, { align: 'center' });
                yPos += 5;
                doc.text(`Gesamtdurchschnitt: ${avgGrade}`, 105, yPos, { align: 'center' });
                yPos += 15;

                // Notentabelle
                doc.setFontSize(14);
                doc.setFont(undefined, 'bold');
                doc.text('Notenübersicht', 20, yPos);
                yPos += 8;

                doc.setFontSize(10);
                doc.setFont(undefined, 'bold');

                // Tabellen-Header
                doc.text('Fach', 20, yPos);
                doc.text('Jahr', 80, yPos);
                doc.text('1.HJ', 100, yPos);
                doc.text('KA', 120, yPos);
                doc.text('Test', 135, yPos);
                doc.text('Mdl', 150, yPos);
                doc.text('2.HJ', 165, yPos);
                yPos += 2;

                // Linie unter Header
                doc.setLineWidth(0.5);
                doc.line(20, yPos, 190, yPos);
                yPos += 5;

                // Notendaten
                doc.setFont(undefined, 'normal');
                grades.forEach(g => {
                    if (yPos > 270) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.text(g.subject, 20, yPos);
                    doc.setFont(undefined, 'bold');
                    doc.text(g.year.toString(), 80, yPos);
                    doc.setFont(undefined, 'normal');
                    doc.text(g.h1.toString(), 100, yPos);
                    doc.setFontSize(9);
                    doc.text(g.ka1.toString(), 120, yPos);
                    doc.text(g.t1.toString(), 135, yPos);
                    doc.text(g.m1.toString(), 150, yPos);
                    doc.setFontSize(10);
                    doc.text(g.h2.toString(), 165, yPos);
                    yPos += 6;
                });

                // === NOTIZEN (direkt auf derselben Seite) ===
                if (notes.length > 0) {
                    // Platz prüfen, ggf. neue Seite
                    if (yPos > 200) {
                        doc.addPage();
                        yPos = 20;
                    } else {
                        yPos += 10; // Abstand nach Noten
                    }

                    doc.setFontSize(14);
                    doc.setFont(undefined, 'bold');
                    doc.text('Notizen', 20, yPos);
                    yPos += 8;

                    // Notizen
                    notes.forEach((note, index) => {
                        if (yPos > 260) {
                            doc.addPage();
                            yPos = 20;
                        }

                        const typeNames = {
                            general: 'Allgemeine Notiz',
                            parent: 'Elterngespräch',
                            punishment: 'Strafarbeit'
                        };

                        doc.setFontSize(10);
                        doc.setFont(undefined, 'bold');
                        doc.text(`${index + 1}. ${typeNames[note.type]}`, 20, yPos);
                        yPos += 5;

                        doc.setFontSize(9);
                        doc.setFont(undefined, 'normal');
                        const dateStr = new Date(note.timestamp).toLocaleDateString('de-DE', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        doc.text(dateStr, 20, yPos);
                        yPos += 5;

                        // Text mit Umbruch
                        const splitText = doc.splitTextToSize(note.text, 170);
                        splitText.forEach(line => {
                            if (yPos > 270) {
                                doc.addPage();
                                yPos = 20;
                            }
                            doc.text(line, 20, yPos);
                            yPos += 4;
                        });

                        yPos += 5; // Abstand zwischen Notizen
                    });
                } else {
                    // Hinweis "Keine Notizen" auf derselben Seite
                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    } else {
                        yPos += 10;
                    }

                    doc.setFontSize(14);
                    doc.setFont(undefined, 'bold');
                    doc.text('Notizen', 20, yPos);
                    yPos += 8;

                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');
                    doc.text('Keine Notizen vorhanden', 20, yPos);
                }
            });

            // PDF speichern
            const filename = studentIds.length === 1 ?
                `Schuelerbericht_${studentIds[0]}.pdf` :
                `Schuelerberichte_${studentIds.length}_Schueler.pdf`;

            doc.save(filename);

            alert(`✅ PDF erfolgreich erstellt!\n\n${studentIds.length} ${studentIds.length === 1 ? 'Schüler' : 'Schüler'} exportiert.`);
        }

        // DATEN BEIM SEITENAUFRUF LADEN
        loadData();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenrechner - Neue Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        
        .login-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        .login-box h1 { text-align: center; margin-bottom: 10px; color: #333; }
        .login-box p { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .login-box input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        .login-box input:focus { outline: none; border-color: #667eea; }
        .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-box button:hover { opacity: 0.9; }
        .demo-hint { text-align: center; margin-top: 15px; font-size: 13px; color: #666; background: #f0f0f0; padding: 10px; border-radius: 8px; }
        
        .app { display: none; width: 100%; height: 100vh; background: #f5f5f5; }
        .app.active { display: flex; }
        
        .sidebar { width: 280px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e0e0e0; font-size: 20px; font-weight: bold; color: #333; cursor: pointer; }
        .sidebar-header:hover { background: #f8f8f8; }
        .sidebar-content { flex: 1; padding: 15px; overflow-y: auto; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #e0e0e0; }
        
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-logout { background: #ffebee; color: #c62828; }
        .btn-logout:hover { background: #ffcdd2; }
        .btn-small { padding: 6px 12px; font-size: 12px; }
        
        .nav-section { margin-bottom: 20px; }
        .nav-section-title { font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; padding: 0 10px; }
        .nav-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .nav-item:hover { background: #f0f0f0; }
        .nav-item.active { background: #e8eaf6; color: #667eea; font-weight: 500; }
        
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .header { margin-bottom: 30px; }
        .header h2 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px; text-align: left; background: #f8f8f8; font-weight: 600; color: #333; border-bottom: 2px solid #e0e0e0; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #fafafa; }
        
        .grade-input { width: 60px; padding: 6px; border: 1px solid #e0e0e0; border-radius: 6px; text-align: center; }
        .grade-input:focus { outline: none; border-color: #667eea; }
        .grade-input.invalid { border-color: #c62828; background: #ffebee; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab.active { background: #667eea; color: white; }
        .tab:hover { opacity: 0.8; }
        
        .welcome { text-align: center; color: #999; padding: 100px 20px; }
        .grade-avg { font-weight: bold; color: #667eea; }
        .grade-total { font-weight: bold; color: #2e7d32; }
        
        .grade-excellent { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
        .grade-good { background: #fff9c4; color: #f57f17; font-weight: bold; }
        .grade-average { background: #fff3e0; color: #e65100; font-weight: bold; }
        .grade-poor { background: #ffebee; color: #c62828; font-weight: bold; }
        
        .grade-table-container { overflow-x: auto; max-width: 100%; }
        .grade-table { min-width: 800px; }
        .sticky-col { position: sticky; background: white; z-index: 2; }
        .sticky-col-1 { left: 0; }
        .sticky-col-2 { left: 150px; }
        .sticky-col-3 { left: 210px; }
        .grade-col-header { min-width: 75px; max-width: 75px; position: relative; }
        .delete-note-btn { background: #ffebee; color: #c62828; border: none; padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 9px; line-height:1; }
        .delete-note-btn:hover { background: #ffcdd2; }
        
        .custom-datepicker { position: fixed; background: white; border: 2px solid #667eea; border-radius: 8px; padding: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; }
        .datepicker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .datepicker-nav { background: #f0f0f0; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .datepicker-nav:hover { background: #e0e0e0; }
        .datepicker-grid { display: grid; grid-template-columns: repeat(7, 35px); gap: 5px; }
        .datepicker-day { padding: 8px; text-align: center; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .datepicker-day:hover { background: #e8eaf6; }
        .datepicker-day.selected { background: #667eea; color: white; font-weight: bold; }
        .datepicker-day.today { border: 2px solid #667eea; }
        .datepicker-day.other-month { color: #ccc; }
        .datepicker-weekday { padding: 5px; text-align: center; font-size: 11px; font-weight: bold; color: #666; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-box h2 { text-align: center; margin-bottom: 10px; color: #333; }
        .modal-box p { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        .modal-box input:focus, .modal-box select:focus { outline: none; border-color: #667eea; }
        .modal-box label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .recovery-key-display { background: #f0f0f0; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; border: 2px dashed #667eea; }
        .recovery-key-code { font-family: monospace; font-size: 24px; font-weight: bold; color: #667eea; letter-spacing: 2px; margin: 15px 0; -webkit-user-select: all; -moz-user-select: all; -ms-user-select: all; user-select: all; }
        .warning-box { background: #fff3e0; border-left: 4px solid #f57f17; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .success-box { background: #e8f5e9; border-left: 4px solid #2e7d32; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .link-button { background: none; border: none; color: #667eea; text-decoration: underline; cursor: pointer; font-size: 14px; padding: 5px; }
        .link-button:hover { color: #5568d3; }

        /* Browser-kompatible user-select Klassen */
        .user-select-none { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        .user-select-all { -webkit-user-select: all; -moz-user-select: all; -ms-user-select: all; user-select: all; }
    </style>
</head>
<body>
    <div class="login-box" id="login">
        <h1>📚 Notenrechner</h1>
        <p>Bitte melden Sie sich an</p>
        <input type="password" id="pwd" placeholder="Passwort" onkeypress="if(event.key==='Enter') login()" autofocus>
        <button onclick="login()">Anmelden</button>
        <div style="text-align: center; margin-top: 15px;">
            <button class="link-button" onclick="showForgotPasswordDialog()">Passwort vergessen?</button>
        </div>
    </div>

    <div class="app" id="app">
        <div class="sidebar">
            <div class="sidebar-header" onclick="showDashboard()">
                <div>📚 Notenrechner</div>
                <div style="font-size: 11px; color: #999; margin-top: 3px;">Schuljahr <span id="schoolYearText">2024/25</span></div>
            </div>
            <div class="sidebar-content">
                <div class="nav-section">
                    <button class="btn btn-primary" onclick="addNewSubject()">+ Fach hinzufügen</button>
                    <div id="navigationTree"></div>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="btn btn-secondary" onclick="showView('classes')">🪑 Klassen verwalten</button>
                <button class="btn btn-secondary" onclick="showView('studentSearch')">📋 Schülerakte</button>
                <button class="btn btn-secondary" onclick="showView('export')">💾 Speichern/Laden</button>
                <button class="btn btn-secondary" onclick="showView('settings')">⚙️ Einstellungen</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Abmelden</button>
            </div>
        </div>
        <div class="main" id="main">
            <div class="welcome">
                <h2>Willkommen!</h2>
                <p>Wählen Sie eine Klasse oder ein Fach aus</p>
            </div>
        </div>
    </div>

    <script>
        // SHA-256 HASH FUNKTION
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        
        // Recovery-Key Generator
        function generateRecoveryKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            const segments = 4;
            const segmentLength = 4;
            let key = '';
            for (let i = 0; i < segments; i++) {
                if (i > 0) key += '-';
                for (let j = 0; j < segmentLength; j++) {
                    key += chars[Math.floor(Math.random() * chars.length)];
                }
            }
            return key;
        }

        // Browser-kompatible Clipboard-Funktion mit Fallback
        async function copyToClipboard(text) {
            // Moderne Browser (Chrome, Edge, Firefox mit HTTPS)
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.warn('Clipboard API fehlgeschlagen, verwende Fallback:', err);
                }
            }

            // Fallback für ältere Browser oder nicht-HTTPS
            try {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);

                if (successful) {
                    return true;
                } else {
                    throw new Error('execCommand copy fehlgeschlagen');
                }
            } catch (err) {
                console.error('Clipboard Fallback fehlgeschlagen:', err);
                alert('Konnte nicht in die Zwischenablage kopieren. Bitte manuell kopieren: ' + text);
                return false;
            }
        }

        // ERWEITERTE DATENSTRUKTUR
        let data = {
            schoolYear: '2024/25',
            classes: {},      // { class_id: { name: "8c", students: [{id, name}] } }
            subjects: {},     // { subject_id: { name: "Mathe", assignedClasses: [class_ids], settings: {} } }
            grades: {},       // { subject_id: { class_id: { student_id: { ka1: [], ka2: [], ... } } } }
            studentNotes: {}, // { student_id: [{ date, type, text, timestamp }] } - Historie für Schüler
            archives: {},     // { schoolYear: { classes, subjects, grades, archivedDate } } - Archivierte Schuljahre
            security: {       // Sicherheitseinstellungen
                passwordHash: null,
                securityQuestion: null,
                securityAnswerHash: null,
                recoveryKeyHash: null,
                isFirstLogin: true
            }
        };

        let current = { view: 'dashboard', classId: null, subjectId: null };
        
        // LOGIN
        async function login() {
            const password = document.getElementById('pwd').value;
            const hash = await hashPassword(password);

            // Wenn kein Passwort gesetzt ist, Standard-Passwort verwenden
            const expectedHash = data.security?.passwordHash || await hashPassword('lehrer123');

            if (hash === expectedHash) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').classList.add('active');
                document.getElementById('pwd').value = '';

                // Prüfen ob erster Login
                if (data.security?.isFirstLogin) {
                    showFirstLoginSetup(password); // Passwort übergeben
                } else {
                    loadDataAfterLogin(password); // Passwort für Entschlüsselung übergeben
                }
            } else {
                alert('Falsches Passwort');
            }
        }

        function logout() {
            document.getElementById('login').style.display = 'block';
            document.getElementById('app').classList.remove('active');
            document.getElementById('pwd').value = '';
            currentPassword = null; // Passwort löschen beim Logout
        }
        
        // ========================================
        // VERSCHLÜSSELUNG
        // ========================================
        let currentPassword = null; // Wird beim Login gesetzt

        // AES-Verschlüsselung mit CryptoJS
        function encryptData(data, password) {
            try {
                const jsonData = JSON.stringify(data);
                const encrypted = CryptoJS.AES.encrypt(jsonData, password).toString();
                return encrypted;
            } catch (error) {
                console.error('Verschlüsselungsfehler:', error);
                return null;
            }
        }

        // AES-Entschlüsselung mit CryptoJS
        function decryptData(encryptedData, password) {
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedData, password);
                const decryptedJson = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedJson) return null;
                return JSON.parse(decryptedJson);
            } catch (error) {
                console.error('Entschlüsselungsfehler:', error);
                return null;
            }
        }

        // DATEN LADEN/SPEICHERN
        function loadData() {
            const saved = localStorage.getItem('notenrechner-neu');
            if (saved) {
                // Prüfen ob Daten verschlüsselt sind
                // Verschlüsselte Daten beginnen mit "U2FsdGVkX1" (Base64 von CryptoJS)
                if (saved.startsWith('U2FsdGVkX1')) {
                    // Daten sind verschlüsselt - können erst nach Login entschlüsselt werden
                    // Initialisiere mit leeren Daten
                    data = {
                        schoolYear: '2024/25',
                        classes: {},
                        subjects: {},
                        grades: {},
                        security: {
                            passwordHash: null,
                            securityQuestion: null,
                            securityAnswerHash: null,
                            recoveryKeyHash: null,
                            isFirstLogin: true
                        },
                        studentNotes: {},
                        archives: {},
                        _encrypted: true // Marker dass Daten verschlüsselt sind
                    };
                } else {
                    // Alte unverschlüsselte Daten (Abwärtskompatibilität)
                    data = JSON.parse(saved);
                }
            }

            if (!data.schoolYear) data.schoolYear = '2024/25';

            // Security-Struktur initialisieren falls nicht vorhanden
            if (!data.security) {
                data.security = {
                    passwordHash: null,
                    securityQuestion: null,
                    securityAnswerHash: null,
                    recoveryKeyHash: null,
                    isFirstLogin: true
                };
            }

            // StudentNotes initialisieren falls nicht vorhanden
            if (!data.studentNotes) {
                data.studentNotes = {};
            }

            // Archives initialisieren falls nicht vorhanden
            if (!data.archives) {
                data.archives = {};
            }
        }

        // Daten nach erfolgreichem Login laden und entschlüsseln
        function loadDataAfterLogin(password) {
            currentPassword = password;

            const saved = localStorage.getItem('notenrechner-neu');
            if (saved && saved.startsWith('U2FsdGVkX1')) {
                // Verschlüsselte Daten entschlüsseln
                const decrypted = decryptData(saved, password);
                if (decrypted) {
                    data = decrypted;
                } else {
                    console.error('Entschlüsselung fehlgeschlagen - verwende Standarddaten');
                }
            }

            updateSchoolYearDisplay();
            renderNavigation();
            showDashboard();
        }

        function saveData() {
            // Daten verschlüsseln wenn Passwort vorhanden
            if (currentPassword) {
                const encrypted = encryptData(data, currentPassword);
                if (encrypted) {
                    localStorage.setItem('notenrechner-neu', encrypted);
                } else {
                    // Fallback: Unverschlüsselt speichern
                    localStorage.setItem('notenrechner-neu', JSON.stringify(data));
                }
            } else {
                // Kein Passwort gesetzt - unverschlüsselt speichern (Abwärtskompatibilität)
                localStorage.setItem('notenrechner-neu', JSON.stringify(data));
            }
        }

        function updateSchoolYearDisplay() {
            const el = document.getElementById('schoolYearText');
            if (el) el.textContent = data.schoolYear || '2024/25';
        }

        // SICHERHEITS-DIALOGE
        let tempPassword = null; // Temporäre Variable für Passwort

        async function showFirstLoginSetup(password) {
            tempPassword = password; // Passwort zwischenspeichern
            const recoveryKey = generateRecoveryKey();
            const recoveryHash = await hashPassword(recoveryKey);

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <h2>🔐 Sicherheitseinrichtung</h2>
                    <p>Willkommen! Bitte richten Sie Ihre Sicherheitsoptionen ein.</p>

                    <div class="warning-box">
                        <strong>Wichtig:</strong> Diese Informationen helfen Ihnen, Ihr Passwort wiederherzustellen, falls Sie es vergessen.
                    </div>

                    <label>Sicherheitsfrage</label>
                    <select id="securityQuestion">
                        <option value="">Bitte wählen...</option>
                        <option value="Wie lautet der Geburtsname Ihrer Mutter?">Wie lautet der Geburtsname Ihrer Mutter?</option>
                        <option value="In welcher Stadt wurden Sie geboren?">In welcher Stadt wurden Sie geboren?</option>
                        <option value="Wie heißt Ihr erstes Haustier?">Wie heißt Ihr erstes Haustier?</option>
                        <option value="Was ist Ihr Lieblingsessen?">Was ist Ihr Lieblingsessen?</option>
                        <option value="Wie lautet der Name Ihrer Grundschule?">Wie lautet der Name Ihrer Grundschule?</option>
                    </select>

                    <label>Ihre Antwort</label>
                    <input type="text" id="securityAnswer" placeholder="Antwort eingeben...">

                    <div class="recovery-key-display">
                        <div style="font-weight: bold; margin-bottom: 10px;">Ihr Recovery-Key:</div>
                        <div class="recovery-key-code">${recoveryKey}</div>
                        <div style="font-size: 13px; color: #666; margin-top: 10px;">
                            <strong>⚠️ Wichtig:</strong> Notieren oder fotografieren Sie diesen Code!<br>
                            Sie können ihn später in den Einstellungen erneut einsehen.
                        </div>
                        <button onclick="copyToClipboard('${recoveryKey}').then(success => { if(success) alert('✅ Code in Zwischenablage kopiert!'); })" style="margin-top: 10px; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                            📋 Code kopieren
                        </button>
                    </div>

                    <div class="modal-buttons">
                        <button onclick="confirmFirstLoginSetup('${recoveryHash}')" style="background: #667eea; color: white;">Weiter</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function confirmFirstLoginSetup(recoveryHash) {
            const question = document.getElementById('securityQuestion').value;
            const answer = document.getElementById('securityAnswer').value;

            if (!question || !answer.trim()) {
                alert('Bitte wählen Sie eine Sicherheitsfrage und geben Sie eine Antwort ein.');
                return;
            }

            const answerHash = await hashPassword(answer.toLowerCase().trim());
            const currentPasswordHash = await hashPassword('lehrer123');

            data.security = {
                passwordHash: currentPasswordHash,
                securityQuestion: question,
                securityAnswerHash: answerHash,
                recoveryKeyHash: recoveryHash,
                isFirstLogin: false
            };

            saveData();

            // Dialog schließen
            const overlay = document.querySelector('.modal-overlay');
            if (overlay) overlay.remove();

            // App laden mit Passwort
            loadDataAfterLogin(tempPassword);

            alert('✅ Sicherheitseinrichtung abgeschlossen!');
        }

        function showForgotPasswordDialog() {
            // Daten laden
            loadData();

            if (data.security?.isFirstLogin || !data.security?.securityQuestion) {
                alert('Es wurde noch keine Sicherheitsfrage eingerichtet.\n\nVerwenden Sie das Standard-Passwort: lehrer123');
                return;
            }

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <h2>🔑 Passwort zurücksetzen</h2>
                    <p>Beantworten Sie Ihre Sicherheitsfrage oder verwenden Sie Ihren Recovery-Key.</p>

                    <div class="tabs" style="margin-bottom: 20px;">
                        <button class="tab active" onclick="switchResetMethod('question')">Sicherheitsfrage</button>
                        <button class="tab" onclick="switchResetMethod('recovery')">Recovery-Key</button>
                    </div>

                    <div id="resetQuestionMethod">
                        <label>Ihre Sicherheitsfrage:</label>
                        <div style="background: #f0f0f0; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 500;">
                            ${data.security.securityQuestion}
                        </div>

                        <label>Ihre Antwort:</label>
                        <input type="text" id="securityAnswerInput" placeholder="Antwort eingeben...">

                        <div class="modal-buttons">
                            <button onclick="closeForgotPasswordDialog()" style="background: #f0f0f0; color: #333;">Abbrechen</button>
                            <button onclick="verifySecurityAnswer()" style="background: #667eea; color: white;">Überprüfen</button>
                        </div>
                    </div>

        // HELPER: Nachname extrahieren
        function getLastName(fullName) {

        // HELPER: Schüler nach Nachnamen sortieren
        function sortStudentsByLastName(students) {

        // HELPER: Durchschnitt berechnen
        function avg(arr) {
            if (!arr || arr.length === 0) return null;
            const valid = arr.filter(g => {
                if (!g) return false;
                const normalized = g.toString().replace(',', '.');
                const num = parseFloat(normalized);
                return !isNaN(num) && num >= 1 && num <= 6;
            });
            if (valid.length === 0) return null;
            const sum = valid.reduce((a, b) => {
                const normalized = b.toString().replace(',', '.');
                return a + parseFloat(normalized);
            }, 0);
            return (sum / valid.length).toFixed(2);
        }
        
        // HELPER: Gewichteter Durchschnitt
        function weighted(ka, t, m, subjectId) {
    if (!subjectId || !data.subjects[subjectId]) return null;
    const s = data.subjects[subjectId].settings;
    if (!s || (!ka && !t && !m)) return null;
    
    let sum = 0, weight = 0;
    
    // Beide Modi (Prozent und Faktor) funktionieren gleich:
    // Die Gewichtung wird durch Multiplikation und Division der Gewichte berechnet
    if (ka) { 
        sum += parseFloat(ka) * s.ka; 
        weight += s.ka; 
    }
    if (t) { 
        sum += parseFloat(t) * s.tests; 
        weight += s.tests; 
    }
    if (m) { 
        sum += parseFloat(m) * s.muendlich; 
        weight += s.muendlich; 
    }
    
    return weight > 0 ? (sum / weight).toFixed(2) : null;
}
        
        // HELPER: Notenfarbe
        function getGradeColor(grade) {
            if (!grade || grade === '-') return '';
            const num = parseFloat(grade);
            if (isNaN(num)) return '';
            if (num >= 1 && num < 2) return 'grade-excellent';
            if (num >= 2 && num < 3) return 'grade-good';
            if (num >= 3 && num < 4) return 'grade-average';
            if (num >= 4 && num <= 6) return 'grade-poor';
            return '';
        }
        
        // HELPER: Notenvalidierung
        function validateGrade(value) {
            if (value === '' || value === null) return true;
            const normalized = value.replace(',', '.');
            const num = parseFloat(normalized);
            return !isNaN(num) && num >= 1 && num <= 6;
        }

        // HELPER: Vorjahresdaten abrufen
        function getPreviousYearData(studentName, subjectName) {
            // Durch alle Archive gehen (neuestes zuerst)
            const archiveYears = Object.keys(data.archives).sort().reverse();

            for (const year of archiveYears) {
                const archive = data.archives[year];

                // Fach im Archiv suchen
                const archiveSubject = Object.entries(archive.subjects).find(([sid, sub]) => sub.name === subjectName);
                if (!archiveSubject) continue;

                const [archiveSubjectId, archiveSub] = archiveSubject;

                // Schüler in allen Klassen des Fachs suchen
                for (const classId of archiveSub.assignedClasses) {
                    const cls = archive.classes[classId];
                    if (!cls) continue;

                    const student = cls.students.find(s => s.name === studentName);
                    if (!student) continue;

                    // Noten des Schülers abrufen
                    if (!archive.grades[archiveSubjectId] || !archive.grades[archiveSubjectId][classId]) continue;
                    const grades = archive.grades[archiveSubjectId][classId][student.id];
                    if (!grades) continue;

                    // Durchschnitte berechnen
                    const ka1 = avg(grades.ka1);
                    const ka2 = avg(grades.ka2);
                    const t1 = avg(grades.test1);
                    const t2 = avg(grades.test2);
                    const m1 = avg(grades.m1);
                    const m2 = avg(grades.m2);
                    const h1 = weighted(ka1, t1, m1, archiveSubjectId);
                    const h2 = weighted(ka2, t2, m2, archiveSubjectId);
                    const yearGrade = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);

                    return {
                        year: year,
                        yearGrade: yearGrade,
                        h1: h1,
                        h2: h2,
                        ka1: ka1,
                        ka2: ka2,
                        t1: t1,
                        t2: t2,
                        m1: m1,
                        m2: m2
                    };
                }
            }

            return null;
        }

        // HELPER: Facheinstellungen aktualisieren
        // HELPER: Facheinstellungen aktualisieren
        function updateSubjectSetting(subjectId, setting, value) {
            console.log('🔧 updateSubjectSetting aufgerufen:', subjectId, setting, value);
            
            if (!data.subjects[subjectId]) {
                console.error('❌ Fach nicht gefunden:', subjectId);
                alert('Fehler: Fach nicht gefunden!');
                return;
            }
            
            const s = data.subjects[subjectId].settings;
            console.log('📊 Aktuelle Settings VOR Änderung:', JSON.stringify(s));
            
            if (setting === 'mode') {
                // Modus wechseln
                const oldMode = s.mode;
                s.mode = value;
                
                console.log('🔄 Modus-Wechsel:', oldMode, '→', value);
                
                // Wenn von Prozent zu Faktor gewechselt wird, Werte anpassen
                if (oldMode === 'percent' && value === 'factor') {
                    s.ka = Math.max(1, Math.min(5, Math.round(s.ka / 25) || 2));
                    s.tests = Math.max(1, Math.min(5, Math.round(s.tests / 25) || 1));
                    s.muendlich = Math.max(1, Math.min(5, Math.round(s.muendlich / 25) || 1));
                }
                else if (oldMode === 'factor' && value === 'percent') {
                    const total = s.ka + s.tests + s.muendlich;
                    s.ka = Math.round((s.ka / total) * 100);
                    s.tests = Math.round((s.tests / total) * 100);
                    s.muendlich = 100 - s.ka - s.tests;
                }

        // ========================================
        // KLASSENUPGRADE FUNKTIONEN
        // ========================================

        // Konfiguration für maximale Jahrgangsstufe (Abschlussklassen)
        const MAX_GRADE_LEVEL = 10;

        // Hilfsfunktion: Jahrgangsstufe aus Klassennamen extrahieren
        function parseClassName(className) {
            const match = className.match(/^(\d+)([a-zA-Z]+)$/);
            if (match) {
                return {
                    level: parseInt(match[1]),
                    letter: match[2],
                    original: className
                };
            }
            return null;
        }

        // Hilfsfunktion: Abschlussklassen erkennen
        function detectGraduatingClasses() {
            const graduating = [];
            Object.entries(data.classes).forEach(([classId, cls]) => {
                const parsed = parseClassName(cls.name);
                if (parsed && parsed.level >= MAX_GRADE_LEVEL) {
                    graduating.push({
                        id: classId,
                        name: cls.name,
                        level: parsed.level,
                        studentCount: cls.students.length
                    });
                }
            });
            return graduating;
        }

        // Hilfsfunktion: Klassennamen hochstufen
        function upgradeClassName(className) {
            const parsed = parseClassName(className);
            if (parsed) {
                return `${parsed.level + 1}${parsed.letter}`;
            }
            return className; // Fallback: Original zurückgeben
        }

        // Hauptfunktion: Alle Klassen hochstufen
        function upgradeAllClasses() {
            const upgradedClasses = {};

            Object.entries(data.classes).forEach(([classId, cls]) => {
                const newName = upgradeClassName(cls.name);
                upgradedClasses[classId] = {
                    ...cls,
                    name: newName
                };
            });

            data.classes = upgradedClasses;
        }

        function archiveCurrentYear() {
            const year = data.schoolYear;

            if (!year || year === '') {
                alert('Kein Schuljahr zum Archivieren vorhanden!');
                return;
            }

            if (data.archives[year]) {
                if (!confirm(`Schuljahr ${year} ist bereits archiviert.\n\nMöchten Sie das Archiv überschreiben?`)) {
                    return;
                }
            }

            // Abschlussklassen erkennen
            const graduatingClasses = detectGraduatingClasses();

            if (graduatingClasses.length > 0) {
                const classNames = graduatingClasses.map(c => `${c.name} (${c.studentCount} Schüler)`).join('\n');
                const warningMsg = `⚠️ ACHTUNG: Abschlussklassen erkannt!\n\n` +
                                   `Die folgenden Klassen sind Abschlussklassen:\n${classNames}\n\n` +
                                   `Diese Klassen werden ins Archiv verschoben und aus dem System entfernt.\n` +
                                   `Die Schüler und ihre Noten bleiben im Archiv gespeichert.\n\n` +
                                   `Möchten Sie fortfahren?`;

                if (!confirm(warningMsg)) {
                    return;
                }
            }

            // Bestätigung für Archivierung
            if (!confirm(`Schuljahr ${year} wirklich archivieren?\n\n` +
                        `Was passiert:\n` +
                        `• Alle Daten werden archiviert\n` +
                        `• Klassen werden hochgestuft (8c → 9c, 9c → 10c)\n` +
                        `• Abschlussklassen (10. Klasse) werden entfernt\n` +
                        `• ALLE Noten werden zurückgesetzt (neues Schuljahr)\n` +
                        `• Schüler bleiben erhalten (mit leeren Notenfeldern)\n\n` +
                        `Fortfahren?`)) {
                return;
            }

            // Archiv erstellen (BEVOR die Klassen hochgestuft werden)
            data.archives[year] = {
                schoolYear: year,
                classes: JSON.parse(JSON.stringify(data.classes)),
                subjects: JSON.parse(JSON.stringify(data.subjects)),
                grades: JSON.parse(JSON.stringify(data.grades)),
                studentNotes: JSON.parse(JSON.stringify(data.studentNotes)),
                archivedDate: Date.now()
            };

            // Abschlussklassen komplett entfernen
            const graduatingClassIds = graduatingClasses.map(c => c.id);
            const graduatedStudentIds = new Set();

            graduatingClassIds.forEach(classId => {
                // Sammle IDs der Schüler aus Abschlussklassen
                const cls = data.classes[classId];
                if (cls && cls.students) {
                    cls.students.forEach(student => {
                        graduatedStudentIds.add(student.id);
                    });
                }

                delete data.classes[classId];

                // Auch aus Fach-Zuordnungen entfernen
                Object.values(data.subjects).forEach(subject => {
                    subject.assignedClasses = subject.assignedClasses.filter(id => id !== classId);
                });
            });

            // Notizen von absolvierten Schülern entfernen (sind im Archiv gespeichert)
            if (data.studentNotes) {
                graduatedStudentIds.forEach(studentId => {
                    delete data.studentNotes[studentId];
                });
            }

            // Restliche Klassen hochstufen
            upgradeAllClasses();

            // ALLE NOTEN zurücksetzen (für neues Schuljahr)
            data.grades = {};

            // Noten-Struktur für jedes Fach neu initialisieren
            Object.keys(data.subjects).forEach(subjectId => {
                data.grades[subjectId] = {};

                // Für jede verbleibende Klasse leere Noten-Struktur erstellen
                Object.entries(data.classes).forEach(([classId, cls]) => {
                    if (data.subjects[subjectId].assignedClasses.includes(classId)) {
                        data.grades[subjectId][classId] = {};

                        // Für jeden Schüler leere Noten erstellen
                        cls.students.forEach(student => {
                            data.grades[subjectId][classId][student.id] = {
                                ka1: [],
                                ka2: [],
                                test1: [],
                                test2: [],
                                m1: [],
                                m2: []
                            };
                        });
                    }
                });
            });

            // Schuljahr aktualisieren
            const currentYearMatch = year.match(/(\d{4})\/(\d{2})/);
            if (currentYearMatch) {
                const year1 = parseInt(currentYearMatch[1]) + 1;
                const year2 = parseInt(currentYearMatch[2]) + 1;
                data.schoolYear = `${year1}/${year2.toString().padStart(2, '0')}`;
            }

            saveData();
            updateSchoolYearDisplay();
            renderNavigation(); // Navigation sofort aktualisieren

            let resultMsg = `✅ Schuljahr ${year} erfolgreich archiviert!\n\n`;
            resultMsg += `Neues Schuljahr: ${data.schoolYear}\n\n`;
            resultMsg += `Was wurde gemacht:\n`;
            resultMsg += `• Klassen hochgestuft\n`;
            if (graduatingClasses.length > 0) {
                resultMsg += `• ${graduatingClasses.length} Abschlussklasse(n) ins Archiv verschoben\n`;
                resultMsg += `• ${graduatedStudentIds.size} Schüler abgeschlossen (im Archiv gespeichert)\n`;
            }
            resultMsg += `• Alle Noten zurückgesetzt\n`;
            resultMsg += `• Verbleibende Schüler mit leeren Notenfeldern\n\n`;
            resultMsg += `Das Archiv ist unter "Archivierte Schuljahre" verfügbar.`;

            alert(resultMsg);

            renderMain();
        }

        function addStudentToClass(classId, name, inputElement) {
            if (!name || !name.trim()) return;
    
                // ✅ NEU: Duplikat-Prüfung
                const trimmedName = name.trim();
                const cls = data.classes[classId];
                const exists = cls.students.some(s => 
                s.name.toLowerCase() === trimmedName.toLowerCase()
            );
    
            if (exists) {
                alert('⚠️ Ein Schüler mit dem Namen "' + trimmedName + '" existiert bereits in dieser Klasse!');
                if (inputElement) {
                    inputElement.value = '';
                    inputElement.focus();
                }
                return;
            }
    
            const id = 'student_' + Date.now();
            cls.students.push({ id, name: trimmedName });
    
            // Noten initialisieren für alle Fächer
            Object.entries(data.subjects).forEach(([subId, sub]) => {
                if (sub.assignedClasses.includes(classId)) {
                    if (!data.grades[subId]) data.grades[subId] = {};
                    if (!data.grades[subId][classId]) data.grades[subId][classId] = {};
                    data.grades[subId][classId][id] = {

                    };
                }
            });
    
            saveData();
            renderMain();
    
            // Fokus auf das Input-Feld der RICHTIGEN Klasse setzen
            setTimeout(() => {
                const newInput = document.querySelector(`input[data-class="${classId}"]`);

        // NOTENEINGABE HELPER-FUNKTIONEN
        
        function handleGradeInput(input) {
            if (validateGrade(input.value)) {
                input.classList.remove('invalid');
            } else if (input.value !== '') {
                input.classList.add('invalid');
            }
        }
        
        function handleGradeKeydown(event, input, studentIndex, totalStudents) {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveGradeIfChanged(input);
                
                if (studentIndex < totalStudents - 1) {
                    const nextRow = input.closest('tr').nextElementSibling;
                    if (nextRow) {
                        const nextInput = nextRow.querySelector(`input[data-index="${input.dataset.index}"]`);
                        if (nextInput) nextInput.focus();
                    }
                }
            } else if (event.key === 'Tab') {
                event.preventDefault();
                saveGradeIfChanged(input);
                
                if (studentIndex < totalStudents - 1) {
                    const nextRow = input.closest('tr').nextElementSibling;
                    if (nextRow) {
                        const nextInput = nextRow.querySelector(`input[data-index="${input.dataset.index}"]`);
                        if (nextInput) nextInput.focus();
                    }
                } else {
                    const currentColIndex = parseInt(input.dataset.index);
                    const firstRow = input.closest('tbody').querySelector('tr:first-child');
                    if (firstRow) {
                        const nextColInput = firstRow.querySelector(`input[data-index="${currentColIndex + 1}"]`);
                        if (nextColInput) nextColInput.focus();
                    }
                }
            }
        }
        
        function saveGradeIfChanged(input) {
            const studentId = input.dataset.studentId;
            const key = input.dataset.key;
            const idx = parseInt(input.dataset.index);
            const val = input.value;
            
            const gradesData = data.grades[current.subjectId][current.classId];
            const currentVal = gradesData[studentId][key][idx];
            
            if (currentVal !== val) {
                if (!validateGrade(val) && val !== '') {
                    input.classList.add('invalid');
                    return;
                }
                
                input.classList.remove('invalid');
                const normalized = val ? val.replace(',', '.') : '';
                gradesData[studentId][key][idx] = normalized;
                saveData();
                updateAveragesInPlace();
            }
        }
        
        function updateAveragesInPlace() {
            const cls = data.classes[current.classId];
            const gradesData = data.grades[current.subjectId][current.classId];
            const tables = document.querySelectorAll('tbody');

            // ✅ Alphabetische Sortierung nach Nachnamen
            const sortedStudents = sortStudentsByLastName([...cls.students]);

            tables.forEach(tbody => {
                const rows = tbody.querySelectorAll('tr');
                if (rows.length === 0) return;

                const key = rows[0].querySelector('input[data-key]')?.dataset.key;
                if (!key) return;

                const sem = key.endsWith('1') ? 1 : 2;

                rows.forEach((row, si) => {
                    if (si >= sortedStudents.length) return;
                    const student = sortedStudents[si];
                    const grades = gradesData[student.id];
                    
                    const avgCell = row.querySelector('.sticky-col-2');
                    const hjCell = row.querySelector('.sticky-col-3');
                    
                    if (avgCell) {
                        const avgVal = avg(grades[key]);
                        avgCell.textContent = avgVal || '-';
                    }
                    
                    if (hjCell) {
                        const hj = weighted(
                            avg(grades[`ka${sem}`]),
                            avg(grades[`test${sem}`]),
                            avg(grades[`m${sem}`]),
                            current.subjectId
                        );
                        hjCell.textContent = hj || '-';
                    }
                });
                
                const thead = tbody.previousElementSibling;
                if (!thead) return;
                
                const headerCells = thead.querySelectorAll('th.grade-col-header');
                headerCells.forEach((th, colIndex) => {
                    const colGrades = cls.students.map(s => gradesData[s.id][key]?.[colIndex]).filter(g => g && validateGrade(g));
                    const colAvg = colGrades.length > 0 ? 
                        (colGrades.reduce((a, b) => a + parseFloat(b.toString().replace(',', '.')), 0) / colGrades.length).toFixed(2) : '-';
                    
                    const avgDiv = th.querySelector('div:last-child');
                    if (avgDiv) {
                        avgDiv.textContent = `Ø ${colAvg}`;
                    }
                });
                
                const hjHeader = thead.querySelector('.sticky-col-3 div');
                if (hjHeader) {
                    const allHJGrades = cls.students.map(s => {
                        const grades = gradesData[s.id];
                        const ka = avg(grades[`ka${sem}`]);
                        const test = avg(grades[`test${sem}`]);
                        const m = avg(grades[`m${sem}`]);
                        return weighted(ka, test, m, current.subjectId);
                    }).filter(h => h);
                    const hjHeaderAvg = allHJGrades.length > 0 ? 
                        (allHJGrades.reduce((a, b) => a + parseFloat(b), 0) / allHJGrades.length).toFixed(2) : '-';
                    hjHeader.textContent = `Ø ${hjHeaderAvg}`;
                }
            });
        }
        
        function updateGradeTitle(key, idx, title) {
            const titleKey = `${key}_title_${idx}`;
            const cls = data.classes[current.classId];
            const gradesData = data.grades[current.subjectId][current.classId];
            cls.students.forEach(s => {
                gradesData[s.id][titleKey] = title;
            });
            saveData();
        }
        
        function updateGradeLabel(key, idx, label) {
            const labelKey = `${key}_label_${idx}`;
            const cls = data.classes[current.classId];
            const gradesData = data.grades[current.subjectId][current.classId];
            cls.students.forEach(s => {
                if (!gradesData[s.id][labelKey]) gradesData[s.id][labelKey] = '';
                gradesData[s.id][labelKey] = label;
            });
            saveData();
            renderMain();
        }
        
        function addNewGradeColumn(key, event) {
            openDatePickerForNewColumn(key, event);
        }
        
        function deleteSingleGradeCol(key, colIndex) {
            if (!confirm('Diese Notenspalte wirklich löschen?')) return;
            const cls = data.classes[current.classId];
            const gradesData = data.grades[current.subjectId][current.classId];
            const labelKey = `${key}_label_${colIndex}`;
            const titleKey = `${key}_title_${colIndex}`;
            
            cls.students.forEach(s => {
                const grades = gradesData[s.id];
                if (grades[key]) {
                    grades[key].splice(colIndex, 1);
                    delete grades[labelKey];
                    delete grades[titleKey];
                    
                    for (let i = colIndex; i < grades[key].length; i++) {
                        const oldLabelKey = `${key}_label_${i + 1}`;
                        const newLabelKey = `${key}_label_${i}`;
                        const oldTitleKey = `${key}_title_${i + 1}`;
                        const newTitleKey = `${key}_title_${i}`;
                        
                        if (grades[oldLabelKey]) {
                            grades[newLabelKey] = grades[oldLabelKey];
                            delete grades[oldLabelKey];
                        }
                        if (grades[oldTitleKey]) {
                            grades[newTitleKey] = grades[oldTitleKey];
                            delete grades[oldTitleKey];
                        }
                    }
                }
            });
            
            saveData();
            renderMain();
        }
        
        // DATEPICKER
        function openDatePicker(key, idx, event) {
            if (event) event.stopPropagation();
            
            const existing = document.querySelector('.custom-datepicker');
            if (existing) existing.remove();
            
            const cls = data.classes[current.classId];
            const gradesData = data.grades[current.subjectId][current.classId];
            const labelKey = `${key}_label_${idx}`;

        function saveDataToFile() {
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'notenrechner-data.json';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ Daten erfolgreich gespeichert!\n\nDatei: notenrechner-data.json\n\nSie können die Datei nun an einen beliebigen Ort verschieben.');
        }

        function loadDataFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (confirm('⚠️ ACHTUNG!\n\nAlle aktuellen Daten werden überschrieben.\nMöchtest du wirklich fortfahren?')) {
                            data = imported;
                            saveData();
                            updateSchoolYearDisplay();
                            renderNavigation();
                            showDashboard();
                            alert('✅ Daten erfolgreich geladen!');
                        }
                    } catch (err) {
                        alert('❌ Fehler beim Laden der Datei!\n\nBitte prüfe, ob es eine gültige Datendatei ist.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function renderClassInSubjectView() {
            const main = document.getElementById('main');
            const sub = data.subjects[current.subjectId];
            const cls = data.classes[current.classId];
            
            if (!sub || !cls) {
                main.innerHTML = '<div class="welcome"><h2>Nicht gefunden</h2></div>';
                return;
            }
            
            // Noten initialisieren falls nicht vorhanden
            if (!data.grades[current.subjectId]) data.grades[current.subjectId] = {};
            if (!data.grades[current.subjectId][current.classId]) data.grades[current.subjectId][current.classId] = {};
            cls.students.forEach(student => {
                if (!data.grades[current.subjectId][current.classId][student.id]) {
                    data.grades[current.subjectId][current.classId][student.id] = {
                        ka1: [], ka2: [], test1: [], test2: [], m1: [], m2: []
                    };
                }
            });
            
            const gradesData = data.grades[current.subjectId][current.classId];
            const gradeType = current.gradeType || 'overview';

            // ✅ Alphabetische Sortierung nach Nachnamen
            const sortedStudents = sortStudentsByLastName([...cls.students]);

            // Statistiken berechnen
            const yearGrades = sortedStudents.map(s => {
                const grades = gradesData[s.id];
                const ka1 = avg(grades.ka1);
                const ka2 = avg(grades.ka2);
                const t1 = avg(grades.test1);
                const t2 = avg(grades.test2);
                const m1 = avg(grades.m1);
                const m2 = avg(grades.m2);
                const h1 = weighted(ka1, t1, m1, current.subjectId);
                const h2 = weighted(ka2, t2, m2, current.subjectId);
                const year = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);
                return { name: s.name, year, ka1, ka2, t1, t2, m1, m2, h1, h2, id: s.id };
            });
            
            const validYearGrades = yearGrades.filter(g => g.year).map(g => ({ name: g.name, grade: parseFloat(g.year) }));
            validYearGrades.sort((a, b) => a.grade - b.grade);
            const top3 = validYearGrades.slice(0, 3);
            const flop3 = validYearGrades.slice(-3).reverse();
            
            const classAvg = validYearGrades.length > 0 ? (validYearGrades.reduce((a, b) => a + b.grade, 0) / validYearGrades.length).toFixed(2) : null;
            const bestGrade = validYearGrades.length > 0 ? Math.min(...validYearGrades.map(g => g.grade)).toFixed(2) : null;
            const worstGrade = validYearGrades.length > 0 ? Math.max(...validYearGrades.map(g => g.grade)).toFixed(2) : null;
            
            const distribution = { excellent: 0, good: 0, average: 0, poor: 0 };
            validYearGrades.forEach(g => {
                if (g.grade >= 1 && g.grade < 2) distribution.excellent++;
                else if (g.grade >= 2 && g.grade < 3) distribution.good++;
                else if (g.grade >= 3 && g.grade < 4) distribution.average++;

        function renderGradesInput(type, cls, gradesData) {
            const typeNames = { ka: 'Klassenarbeiten', test: 'Tests', m: 'Mündliche Noten' };
            let html = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">';

            // ✅ Alphabetische Sortierung nach Nachnamen
            const sortedStudents = sortStudentsByLastName([...cls.students]);

            [1, 2].forEach(sem => {
                const key = type + sem;
                const maxCols = Math.max(...sortedStudents.map(s => gradesData[s.id][key]?.length || 0), 0);

                html += '<div class="card">';
                html += `<h3 style="margin-bottom: 15px;">${sem}. Halbjahr</h3>`;

                // HJ-Durchschnitt
                const semKey = { ka: 'ka', test: 'test', m: 'm' }[type];
                const allHJGrades = sortedStudents.map(s => {
                    const grades = gradesData[s.id];
                    const ka = avg(grades[`ka${sem}`]);
                    const test = avg(grades[`test${sem}`]);
                    const m = avg(grades[`m${sem}`]);
                    return weighted(ka, test, m, current.subjectId);
                }).filter(h => h);
                const hjHeaderAvg = allHJGrades.length > 0 ? (allHJGrades.reduce((a, b) => a + parseFloat(b), 0) / allHJGrades.length).toFixed(2) : '-';

                html += '<div class="grade-table-container"><table class="grade-table"><thead><tr>';
                html += '<th class="sticky-col sticky-col-1" style="min-width:150px;">Name</th>';
                html += '<th class="sticky-col sticky-col-2" style="min-width:60px; background:#e3f2fd;">Ø</th>';
                html += `<th class="sticky-col sticky-col-3" style="min-width:70px; background:#e8f5e9;">HJ<div style="font-size:10px; color:#2e7d32; font-weight:bold; margin-top:2px;">Ø ${hjHeaderAvg}</div></th>`;

                for (let i = 0; i < maxCols; i++) {
                    const titleKey = `${key}_title_${i}`;
                    const labelKey = `${key}_label_${i}`;
                    const title = gradesData[sortedStudents[0]?.id]?.[titleKey] || `${typeNames[type]} ${i + 1}`;
                    const label = gradesData[sortedStudents[0]?.id]?.[labelKey] || '';

                    let displayDate = label || new Date().toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
                    if (label) {
                        const parts = label.split('-');
                        if (parts.length === 3) displayDate = `${parts[2]}.${parts[1]}.${parts[0]}`;
                    }

                    const colGrades = sortedStudents.map(s => gradesData[s.id][key]?.[i]).filter(g => g && validateGrade(g));
                    const colAvg = colGrades.length > 0 ? (colGrades.reduce((a, b) => a + parseFloat(b.toString().replace(',', '.')), 0) / colGrades.length).toFixed(2) : '-';

                    html += `<th class="grade-col-header" style="padding:6px 4px;">
                        <input type="text" value="${title}" onchange="updateGradeTitle('${key}',${i},this.value)"
                               style="width:100%; padding:2px 4px; border:1px solid #e0e0e0; border-radius:4px; font-size:11px; font-weight:600; text-align:center; margin-bottom:4px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
                            <div onclick="openDatePicker('${key}',${i}, event)" class="user-select-none" style="cursor:pointer; font-size:10px; font-weight:500; color:#666;">${displayDate}</div>
                            <button class="delete-note-btn" onclick="deleteSingleGradeCol('${key}',${i})">🗑️</button>
                        </div>
                        <div style="font-size:10px; color:#667eea; font-weight:bold; text-align:left;">Ø ${colAvg}</div>
                    </th>`;
                }

                html += `<th style="min-width:75px; background:#f0f0f0; padding:8px 4px;"><div onclick="addNewGradeColumn('${key}', event)" class="user-select-none" style="cursor:pointer; text-align:center; padding:8px 0; color:#667eea; font-weight:600;"><div style="font-size:20px; margin-bottom:3px;">+</div><div style="font-size:10px;">Neuer Test</div></div></th>`;                html += '</tr></thead><tbody>';

                sortedStudents.forEach((student, si) => {
                    const grades = gradesData[student.id];
                    if (!grades[key]) grades[key] = [];
                    
                    const avgVal = avg(grades[key]);
                    const hj = weighted(
                        avg(grades[`ka${sem}`]),
                        avg(grades[`test${sem}`]),
                        avg(grades[`m${sem}`]),
                        current.subjectId
                    );
                    
                    html += `<tr><td class="sticky-col sticky-col-1" style="background:white;">${student.name}</td>`;
                    html += `<td class="sticky-col sticky-col-2" style="background:#e3f2fd; font-weight:bold; color:#1976d2;">${avgVal || '-'}</td>`;
                    html += `<td class="sticky-col sticky-col-3" style="background:#e8f5e9; font-weight:bold; color:#2e7d32;">${hj || '-'}</td>`;
                    
                    for (let i = 0; i < maxCols; i++) {
                        const val = grades[key][i] || '';
                        const isValid = validateGrade(val);
                        html += `<td><input class="grade-input ${isValid ? '' : 'invalid'}" value="${val}"
                                     data-student-id="${student.id}" data-key="${key}" data-index="${i}"
                                     oninput="handleGradeInput(this)"
                                     onkeydown="handleGradeKeydown(event, this, ${si}, ${sortedStudents.length})"
                                     onblur="saveGradeIfChanged(this)"
                                     style="width:65px;" placeholder="-"></td>`;
                    }
                    
                    html += '<td style="background:#f9f9f9;"></td></tr>';
                });
                
                html += '</tbody></table></div></div>';
            });
            
            html += '</div>';
            return html;
        }

        // SCHÜLERSUCHE & NOTIZEN
        let studentFilterMode = 'all'; // 'all' | 'atrisk' | 'critical'

        function renderStudentSearch() {
            const main = document.getElementById('main');

            // Alle Schüler sammeln mit Notenzusammenfassung
            const allStudents = [];
            Object.entries(data.classes).forEach(([classId, cls]) => {
                cls.students.forEach(student => {
                    // Noten über alle Fächer sammeln
                    const grades = [];
                    Object.entries(data.subjects).forEach(([subjectId, subject]) => {
                        if (subject.assignedClasses.includes(classId) &&
                            data.grades[subjectId] &&
                            data.grades[subjectId][classId] &&
                            data.grades[subjectId][classId][student.id]) {

                            const studentGrades = data.grades[subjectId][classId][student.id];
                            const ka1 = avg(studentGrades.ka1);
                            const ka2 = avg(studentGrades.ka2);
                            const t1 = avg(studentGrades.test1);
                            const t2 = avg(studentGrades.test2);
                            const m1 = avg(studentGrades.m1);
                            const m2 = avg(studentGrades.m2);
                            const h1 = weighted(ka1, t1, m1, subjectId);
                            const h2 = weighted(ka2, t2, m2, subjectId);
                            const year = h1 && h2 ? ((parseFloat(h1) + parseFloat(h2)) / 2).toFixed(2) : (h1 || h2 || null);

                            if (year) {
                                grades.push({ subject: subject.name, grade: parseFloat(year) });
                            }
                        }
                    });

                    const avgGrade = grades.length > 0 ?
                        (grades.reduce((a, b) => a + b.grade, 0) / grades.length).toFixed(2) : null;

                    const notes = data.studentNotes[student.id] || [];

                    allStudents.push({
                        id: student.id,
                        name: student.name,
                        className: cls.name,
                        classId: classId,
                        grades: grades,
                        avgGrade: avgGrade,
                        noteCount: notes.length
                    });
                });
            });

            allStudents.sort((a, b) => a.name.localeCompare(b.name));

            // Gefährdete Schüler zählen
            const atRiskCount = allStudents.filter(s => s.avgGrade && parseFloat(s.avgGrade) >= 4.5).length;
            const criticalCount = allStudents.filter(s => s.avgGrade && parseFloat(s.avgGrade) >= 5.0).length;

            let html = `

                        <button onclick="setStudentFilter('all')" id="filter-all"

                                       color: ${studentFilterMode === 'all' ? 'white' : '#666'}; border: none;
                                       border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">

                        <button onclick="setStudentFilter('atrisk')" id="filter-atrisk"
                                style="padding: 8px 16px; background: ${studentFilterMode === 'atrisk' ? '#ff9800' : '#fff3e0'};
                                       color: ${studentFilterMode === 'atrisk' ? 'white' : '#e65100'}; border: none;
                                       border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
                            ⚠️ Gefährdet (Ø ≥ 4,5) · ${atRiskCount}
                        </button>
                        <button onclick="setStudentFilter('critical')" id="filter-critical"
                                style="padding: 8px 16px; background: ${studentFilterMode === 'critical' ? '#c62828' : '#ffebee'};
                                       color: ${studentFilterMode === 'critical' ? 'white' : '#c62828'}; border: none;
                                       border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
                            🔴 Kritisch (Ø ≥ 5,0) · ${criticalCount}
                        </button>
                    </div>

                    <div style="margin-bottom: 10px; display: flex; gap: 10px;">
                        <button onclick="selectAllStudents()"

                        <span id="selectedCount" style="padding: 6px 12px; background: #e8eaf6; color: #667eea; border-radius: 6px; font-size: 12px; font-weight: 600;">

                    // Filter anwenden
                    let shouldDisplay = true;
                    if (studentFilterMode === 'atrisk' && !isAtRisk && !isCritical) shouldDisplay = false;
                    if (studentFilterMode === 'critical' && !isCritical) shouldDisplay = false;

                    // Hintergrundfarbe für gefährdete Schüler
                    let rowStyle = '';
                    if (isCritical) {
